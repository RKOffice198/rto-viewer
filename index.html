<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1,
           maximum-scale=1,
           user-scalable=no,
           viewport-fit=cover"
>

<title>RTO Viewer</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {

  box-sizing:
    border-box;

  -webkit-tap-highlight-color:
    transparent;

}


html,
body {

  margin:
    0;

  padding:
    0;

  width:
    100%;

  min-height:
    100%;

  background:
    #f1f3f5;

  color:
    #111827;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}


body {

  overscroll-behavior:
    none;

}


/* =====================================================
   HEADER
===================================================== */

.header {

  position:
    sticky;

  top:
    0;

  z-index:
    1000;

  width:
    100%;

  background:
    #111827;

  color:
    white;

  padding:
    calc(
      6px +
      env(safe-area-inset-top)
    )
    7px
    7px;

  box-shadow:
    0 2px 8px
    rgba(
      0,
      0,
      0,
      .25
    );

}


.headerRow {

  width:
    100%;

  min-height:
    40px;

  display:
    flex;

  align-items:
    center;

  gap:
    5px;

}


.title {

  flex:
    1;

  min-width:
    0;

  font-size:
    17px;

  font-weight:
    800;

  white-space:
    nowrap;

}


.accountSelector {

  width:
    90px;

  max-width:
    105px;

  height:
    36px;

  border:
    0;

  border-radius:
    8px;

  background:
    white;

  color:
    #111827;

  font-size:
    12px;

  font-weight:
    800;

  padding:
    0 5px;

  outline:
    none;

}


.counter {

  font-size:
    12px;

  font-weight:
    800;

  white-space:
    nowrap;

}


.headerButton {

  height:
    36px;

  min-width:
    38px;

  border:
    0;

  border-radius:
    8px;

  background:
    #374151;

  color:
    white;

  font-size:
    13px;

  font-weight:
    800;

  padding:
    0 7px;

}


.headerButton:active {

  transform:
    scale(.94);

}


/* =====================================================
   SEARCH
===================================================== */

.searchContainer {

  display:
    none;

  position:
    relative;

  margin-top:
    6px;

}


.searchContainer.show {

  display:
    block;

}


#search {

  width:
    100%;

  height:
    42px;

  border:
    0;

  border-radius:
    9px;

  outline:
    none;

  padding:
    0 40px
    0 13px;

  background:
    white;

  font-size:
    16px;

}


.searchIcon {

  position:
    absolute;

  right:
    13px;

  top:
    10px;

  color:
    #6b7280;

  pointer-events:
    none;

}


/* =====================================================
   MAIN
===================================================== */

.container {

  width:
    100%;

  max-width:
    650px;

  margin:
    0 auto;

  padding:
    8px;

  padding-bottom:
    calc(
      10px +
      env(safe-area-inset-bottom)
    );

}


/* =====================================================
   LOADING
===================================================== */

.loading {

  width:
    100%;

  padding:
    60px 20px;

  text-align:
    center;

  font-size:
    16px;

  font-weight:
    800;

}


.loading.error {

  color:
    #dc2626;

}


/* =====================================================
   VIEWER
===================================================== */

.viewer {

  width:
    100%;

  background:
    white;

  border-radius:
    12px;

  padding:
    7px;

  box-shadow:
    0 2px 10px
    rgba(
      0,
      0,
      0,
      .12
    );

}


/* =====================================================
   IMAGE
===================================================== */

.imageBox {

  width:
    100%;

  height:
    calc(
      100dvh -
      250px
    );

  min-height:
    300px;

  max-height:
    750px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  overflow:
    hidden;

  border-radius:
    9px;

  background:
    #e5e7eb;

  touch-action:
    pan-y;

}


.imageBox img {

  display:
    block;

  max-width:
    100%;

  max-height:
    100%;

  width:
    auto;

  height:
    auto;

  object-fit:
    contain;

  user-select:
    none;

  -webkit-user-drag:
    none;

}


.noImage {

  text-align:
    center;

  color:
    #6b7280;

  font-weight:
    800;

}


.noImage small {

  display:
    block;

  margin-top:
    6px;

  font-weight:
    400;

}


/* =====================================================
   INFO
===================================================== */

.info {

  margin-top:
    7px;

  padding:
    9px;

  border:
    1px solid
    #e5e7eb;

  border-radius:
    9px;

}


.model {

  font-size:
    18px;

  line-height:
    23px;

  font-weight:
    800;

  word-break:
    break-word;

}


.qty {

  margin-left:
    6px;

  color:
    #dc2626;

  font-size:
    15px;

  font-weight:
    800;

}


.infoRow {

  display:
    flex;

  gap:
    7px;

  margin-top:
    5px;

  font-size:
    14px;

  line-height:
    19px;

}


.label {

  color:
    #6b7280;

  font-weight:
    700;

}


.value {

  flex:
    1;

  min-width:
    0;

  font-weight:
    800;

  word-break:
    break-word;

}


/* =====================================================
   NAVIGATION
===================================================== */

.navigation {

  display:
    grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    7px;

  margin-top:
    7px;

}


.navigation button {

  min-height:
    46px;

  border:
    0;

  border-radius:
    9px;

  background:
    #111827;

  color:
    white;

  font-size:
    14px;

  font-weight:
    800;

}


.navigation button:disabled {

  opacity:
    .3;

}


.navigation button:active {

  transform:
    scale(.98);

}


.hint {

  margin-top:
    5px;

  text-align:
    center;

  color:
    #6b7280;

  font-size:
    11px;

}


/* =====================================================
   LIST
===================================================== */

.list {

  display:
    none;

}

.listQty {

  display: inline-block;

  margin-left: 6px;

  color: #dc2626;

  font-size: 13px;

  font-weight: 800;

}

.list.show {

  display:
    block;

}


.listItem {

  display:
    flex;

  align-items:
    center;

  gap:
    9px;

  width:
    100%;

  min-height:
    76px;

  margin-bottom:
    7px;

  padding:
    8px;

  border-radius:
    9px;

  background:
    white;

  box-shadow:
    0 1px 5px
    rgba(
      0,
      0,
      0,
      .10
    );

}


.thumbnail {

  flex:
    0 0 58px;

  width:
    58px;

  height:
    68px;

  overflow:
    hidden;

  border-radius:
    7px;

  background:
    #e5e7eb;

}


.thumbnail img {

  width:
    100%;

  height:
    100%;

  object-fit:
    contain;

}


.listInfo {

  flex:
    1;

  min-width:
    0;

}


.listNumber {

  color:
    #2563eb;

  font-weight:
    800;

}


.listModel {

  font-size:
    15px;

  line-height:
    19px;

  font-weight:
    800;

  word-break:
    break-word;

}


.listDetails {

  margin-top:
    4px;

  color:
    #4b5563;

  font-size:
    13px;

}


/* =====================================================
   MOBILE
===================================================== */

@media (
  max-width: 420px
) {

  .title {

    font-size:
      15px;

  }


  .accountSelector {

    width:
      78px;

    max-width:
      85px;

    font-size:
      11px;

  }


  .counter {

    font-size:
      11px;

  }


  .headerButton {

    min-width:
      36px;

    padding:
      0 6px;

  }


  .imageBox {

    height:
      calc(
        100dvh -
        235px
      );

    min-height:
      300px;

  }


  .model {

    font-size:
      17px;

  }

}


@media (
  max-width: 350px
) {

  .title {

    font-size:
      14px;

  }


  .accountSelector {

    width:
      68px;

  }


  .counter {

    display:
      none;

  }

}

</style>

</head>


<body>


<!-- ===================================================
     HEADER
=================================================== -->

<div class="header">

  <div class="headerRow">


    <div class="title">
      RTO Viewer
    </div>


    <select
      id="accountSelector"
      class="accountSelector"
      onchange="changeAccount()"
    >

      <option value="">
        Loading...
      </option>

    </select>


    <div
      id="counter"
      class="counter"
    >
      0 / 0
    </div>


    <button
      id="listButton"
      class="headerButton"
      onclick="toggleList()"
    >
      List
    </button>


    <button
      class="headerButton"
      onclick="loadData()"
    >
      ↻
    </button>


  </div>


  <div
    id="searchContainer"
    class="searchContainer"
  >

    <input
      id="search"
      type="search"
      placeholder="Tap here to search..."
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      readonly
      onclick="activateSearch()"
      oninput="renderList()"
    >


    <span class="searchIcon">
      🔍
    </span>

  </div>

</div>



<!-- ===================================================
     CONTENT
=================================================== -->

<div class="container">


  <div
    id="loading"
    class="loading"
  >
    Loading...
  </div>


  <div
    id="viewer"
    class="viewer"
    style="display:none"
  >


    <div
      id="imageBox"
      class="imageBox"
    >

      <img
        id="mainImage"
        alt=""
      >

    </div>


    <div class="info">


      <div>

        <span
          id="model"
          class="model"
        ></span>


        <span
          id="qty"
          class="qty"
        ></span>

      </div>


      <div class="infoRow">

        <span class="label">
          Rack:
        </span>

        <span
          id="rack"
          class="value"
        ></span>

      </div>


      <div class="infoRow">

        <span class="label">
          Image:
        </span>

        <span
          id="imageCode"
          class="value"
        ></span>

      </div>


    </div>


    <div class="navigation">


      <button
        id="previous"
        onclick="move(-1)"
      >
        ← Previous
      </button>


      <button
        id="next"
        onclick="move(1)"
      >
        Next →
      </button>


    </div>


    <div class="hint">
      Swipe left / right
    </div>


  </div>


  <div
    id="list"
    class="list"
  ></div>


</div>



<script>


// =====================================================
// APPS SCRIPT WEB APP URL
// =====================================================
//
// IMPORTANT:
// Keep your CURRENT /exec URL here.
//
// If you create a new deployment,
// replace this URL with the new /exec URL.
// =====================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbwjVrkB6YYbmmyOwsM2u3HdlUgOaUZAREz-QxqRCTDUnMXAgkLfu5TKkEsdbJVPCCc7MA/exec";


// =====================================================
// VARIABLES
// =====================================================

let rows = [];

let currentIndex =
  0;

let listMode =
  false;

let touchStartX =
  0;

let touchStartY =
  0;


// =====================================================
// SHORTCUT
// =====================================================

function $(id) {

  return document.getElementById(
    id
  );

}


// =====================================================
// API CALL
// =====================================================

function jsonp(
  url,
  callback
) {


  const callbackName =
    "jsonp_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() *
      100000
    );


  window[
    callbackName
  ] =
    function(data) {

      try {

        callback(
          data
        );

      }

      finally {

        delete window[
          callbackName
        ];

        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    url +
    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +
    "&t=" +
    Date.now();


  script.onerror =
    function() {

      delete window[
        callbackName
      ];


      if (
        script.parentNode
      ) {

        script.parentNode
          .removeChild(
            script
          );

      }


      showError(
        "Unable to connect to Google Apps Script."
      );

    };


  document.body.appendChild(
    script
  );

}


// =====================================================
// LOAD ACCOUNTS
// =====================================================

function loadAccounts() {


  jsonp(
    API_URL +
    "?action=accounts",
    function(data) {


      if (
        !data ||
        !data.success
      ) {

        showError(
          data &&
          data.error
            ? data.error
            : "Unable to load accounts."
        );

        return;

      }


      const selector =
        $("accountSelector");


      selector.innerHTML =
        "";


      if (
        !data.accounts ||
        !data.accounts.length
      ) {

        showError(
          "No account headers found in RTO sheet."
        );

        return;

      }


      data.accounts.forEach(
        function(
          account
        ) {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            account;


          option.textContent =
            account;


          selector.appendChild(
            option
          );

        }
      );


      // -----------------------------------------------
      // REMEMBER LAST ACCOUNT
      // -----------------------------------------------

      let saved =
        "";


      try {

        saved =
          localStorage.getItem(
            "RTO_SELECTED_ACCOUNT"
          ) || "";

      }

      catch (error) {}


      let selected =
        "";


      if (
        saved &&
        data.accounts.includes(
          saved
        )
      ) {

        selected =
          saved;

      }


      // Prefer MEESHO

      if (
        !selected
      ) {

        const meesho =
          data.accounts.find(
            function(name) {

              return (
                name
                  .toLowerCase() ===
                "meesho"
              );

            }
          );


        if (
          meesho
        ) {

          selected =
            meesho;

        }

      }


      // Otherwise first

      if (
        !selected
      ) {

        selected =
          data.accounts[0];

      }


      selector.value =
        selected;


      loadData();

    }
  );

}


// =====================================================
// CHANGE ACCOUNT
// =====================================================

function changeAccount() {


  const account =
    $("accountSelector").value;


  if (
    !account
  ) {

    return;

  }


  try {

    localStorage.setItem(
      "RTO_SELECTED_ACCOUNT",
      account
    );

  }

  catch (error) {}


  currentIndex =
    0;


  listMode =
    false;


  $("viewer")
    .style
    .display =
    "none";


  $("list")
    .classList
    .remove(
      "show"
    );


  $("searchContainer")
    .classList
    .remove(
      "show"
    );


  $("listButton")
    .textContent =
    "List";


  loadData();

}


// =====================================================
// LOAD DATA
// =====================================================

function loadData() {


  const account =
    $("accountSelector").value;


  if (
    !account
  ) {

    return;

  }


  $("loading")
    .style
    .display =
    "block";


  $("loading")
    .classList
    .remove(
      "error"
    );


  $("loading")
    .textContent =
    "Loading " +
    account +
    "...";


  $("viewer")
    .style
    .display =
    "none";


  jsonp(
    API_URL +
    "?action=data" +
    "&account=" +
    encodeURIComponent(
      account
    ),

    function(data) {


      if (
        !data ||
        !data.success
      ) {

        showError(
          data &&
          data.error
            ? data.error
            : "Unable to load RTO data."
        );

        return;

      }


      rows =
        data.rows ||
        [];


      currentIndex =
        0;


      $("loading")
        .style
        .display =
        "none";


      if (
        rows.length
      ) {

        $("viewer")
          .style
          .display =
          "block";

        render();

      }

      else {

        $("loading")
          .style
          .display =
          "block";

        $("loading")
          .textContent =
          "No RTO records found for " +
          account;

      }

    }
  );

}


// =====================================================
// ERROR
// =====================================================

function showError(
  message
) {


  $("loading")
    .style
    .display =
    "block";


  $("loading")
    .classList
    .add(
      "error"
    );


  $("loading")
    .textContent =
    "Error: " +
    message;

}


// =====================================================
// RENDER MAIN VIEW
// =====================================================

function render() {


  if (
    !rows.length
  ) {

    return;

  }


  const row =
    rows[
      currentIndex
    ];


  $("counter")
    .textContent =
    (
      currentIndex +
      1
    ) +
    " / " +
    rows.length;


  $("model")
    .textContent =
    row.model ||
    "";


  $("qty")
    .textContent =
    "Qty: " +
    (
      row.qty ||
      1
    );


  $("rack")
    .textContent =
    row.rack ||
    "-";


  $("imageCode")
    .textContent =
    row.imageCode ||
    "-";


  const image =
    $("mainImage");


  const imageBox =
    $("imageBox");


  // Remove old no-image message

  const oldMessage =
    imageBox.querySelector(
      ".noImage"
    );


  if (
    oldMessage
  ) {

    oldMessage.remove();

  }


  if (
    row.imageUrl
  ) {

    image.style.display =
      "block";


    image.src =
      row.imageUrl;


    image.alt =
      row.imageCode ||
      row.model ||
      "RTO Image";

  }

  else {

    image.style.display =
      "none";


    const message =
      document.createElement(
        "div"
      );


    message.className =
      "noImage";


    message.innerHTML =
      "Image not found" +
      "<small>" +
      escapeHtml(
        row.imageCode ||
        ""
      ) +
      "</small>";


    imageBox.appendChild(
      message
    );

  }


  $("previous")
    .disabled =
    currentIndex <= 0;


  $("next")
    .disabled =
    currentIndex >=
    rows.length - 1;


  // Preload adjacent images

  preload(
    currentIndex - 1
  );


  preload(
    currentIndex + 1
  );

}


// =====================================================
// NEXT / PREVIOUS
// =====================================================

function move(
  direction
) {


  const newIndex =
    currentIndex +
    direction;


  if (
    newIndex < 0 ||
    newIndex >=
    rows.length
  ) {

    return;

  }


  currentIndex =
    newIndex;


  render();

}


// =====================================================
// LIST MODE
// =====================================================

function toggleList() {


  listMode =
    !listMode;


  if (
    listMode
  ) {


    $("viewer")
      .style
      .display =
      "none";


    $("list")
      .classList
      .add(
        "show"
      );


    $("searchContainer")
      .classList
      .add(
        "show"
      );


    // IMPORTANT:
    // Keyboard does NOT open automatically.

    $("search")
      .readOnly =
      true;


    $("search")
      .value =
      "";


    $("search")
      .blur();


    $("listButton")
      .textContent =
      "Viewer";


    renderList();

  }

  else {


    $("viewer")
      .style
      .display =
      "block";


    $("list")
      .classList
      .remove(
        "show"
      );


    $("searchContainer")
      .classList
      .remove(
        "show"
      );


    $("search")
      .readOnly =
      true;


    $("search")
      .blur();


    $("search")
      .value =
      "";


    $("listButton")
      .textContent =
      "List";


    render();

  }

}


// =====================================================
// SEARCH CLICK
// =====================================================
//
// Keyboard opens ONLY when user actually taps search.
// =====================================================

function activateSearch() {


  const search =
    $("search");


  search.readOnly =
    false;


  setTimeout(
    function() {

      search.focus();

    },
    50
  );

}


// =====================================================
// RENDER LIST
// =====================================================

function renderList() {

  const list =
    $("list");

  const searchText =
    $("search")
      .value
      .trim()
      .toLowerCase();

  list.innerHTML = "";


  rows.forEach(
    function(row, index) {

      const searchableText =
        (
          row.model +
          " " +
          row.rack +
          " " +
          row.imageCode +
          " " +
          row.productCode
        )
        .toLowerCase();


      if (
        searchText &&
        !searchableText.includes(
          searchText
        )
      ) {

        return;

      }


      const item =
        document.createElement(
          "div"
        );

      item.className =
        "listItem";


      item.onclick =
        function() {

          currentIndex =
            index;

          listMode =
            false;


          $("viewer")
            .style
            .display =
            "block";


          $("list")
            .classList
            .remove(
              "show"
            );


          $("searchContainer")
            .classList
            .remove(
              "show"
            );


          $("search")
            .value =
            "";


          $("search")
            .readOnly =
            true;


          $("search")
            .blur();


          $("listButton")
            .textContent =
            "List";


          render();


          window.scrollTo(
            0,
            0
          );

        };


      

      // =================================================
      // LIST INFORMATION
      // =================================================

      const info =
        document.createElement(
          "div"
        );

      info.className =
        "listInfo";


      info.innerHTML =

        "<div>" +

          "<span class='listNumber'>" +

            (
              index + 1
            ) +

          "</span> " +

          "<span class='listModel'>" +

            escapeHtml(
              row.model
            ) +

          "</span>" +

          "<span class='listQty'>" +

            "Qty: " +

            (
              row.qty ||
              1
            ) +

          "</span>" +

        "</div>" +


        "<div class='listDetails'>" +

          "Rack: <b>" +

          escapeHtml(
            row.rack ||
            "-"
          ) +

          "</b>" +

          " &nbsp; | &nbsp; Image: <b>" +

          escapeHtml(
            row.imageCode ||
            "-"
          ) +

          "</b>" +

        "</div>";


      item.appendChild(
        thumbnail
      );


      item.appendChild(
        info
      );


      list.appendChild(
        item
      );

    }
  );

}
      // -----------------------------------------------
      // THUMBNAIL
      // -----------------------------------------------

      const thumbnail =
        document.createElement(
          "div"
        );


      thumbnail.className =
        "thumbnail";


      if (
        row.imageUrl
      ) {

        const img =
          document.createElement(
            "img"
          );


        img.loading =
          "lazy";


        img.src =
          row.imageUrl;


        thumbnail.appendChild(
          img
        );

      }


      // -----------------------------------------------
      // INFORMATION
      // -----------------------------------------------

      const info =
        document.createElement(
          "div"
        );


      info.className =
        "listInfo";


      info.innerHTML =

        "<div>" +

          "<span class='listNumber'>" +

            (
              index +
              1
            ) +

          "</span> " +

          "<span class='listModel'>" +

            escapeHtml(
              row.model
            ) +

          "</span>" +

        "</div>" +


        "<div class='listDetails'>" +

          "Rack: <b>" +

          escapeHtml(
            row.rack ||
            "-"
          ) +

          "</b>" +

          " &nbsp; | &nbsp; Image: <b>" +

          escapeHtml(
            row.imageCode ||
            "-"
          ) +

          "</b>" +

        "</div>";


      item.appendChild(
        thumbnail
      );


      item.appendChild(
        info
      );


      list.appendChild(
        item
      );

    }
  );

}


// =====================================================
// PRELOAD IMAGE
// =====================================================

function preload(
  index
) {


  if (
    index < 0 ||
    index >=
    rows.length
  ) {

    return;

  }


  if (
    !rows[index].imageUrl
  ) {

    return;

  }


  const img =
    new Image();


  img.src =
    rows[index].imageUrl;

}


// =====================================================
// KEYBOARD
// =====================================================

document.addEventListener(
  "keydown",
  function(event) {


    if (
      document.activeElement ===
      $("search")
    ) {

      return;

    }


    if (
      event.key ===
      "ArrowLeft"
    ) {

      move(-1);

    }


    if (
      event.key ===
      "ArrowRight"
    ) {

      move(1);

    }

  }
);


// =====================================================
// SWIPE
// =====================================================

$("imageBox")
  .addEventListener(
    "touchstart",
    function(event) {

      const touch =
        event.changedTouches[0];


      touchStartX =
        touch.clientX;


      touchStartY =
        touch.clientY;

    },
    {
      passive:
        true
    }
  );


$("imageBox")
  .addEventListener(
    "touchend",
    function(event) {

      const touch =
        event.changedTouches[0];


      const dx =
        touch.clientX -
        touchStartX;


      const dy =
        touch.clientY -
        touchStartY;


      if (
        Math.abs(dx) > 55 &&
        Math.abs(dx) >
        Math.abs(dy)
      ) {

        if (
          dx < 0
        ) {

          move(1);

        }

        else {

          move(-1);

        }

      }

    },
    {
      passive:
        true
    }
  );


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(
  text
) {

  return String(
    text || ""
  )
  .replace(
    /[&<>"']/g,
    function(character) {

      return {

        "&":
          "&amp;",

        "<":
          "&lt;",

        ">":
          "&gt;",

        '"':
          "&quot;",

        "'":
          "&#39;"

      }[
        character
      ];

    }
  );

}

loadAccounts();
